
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}

	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}

		filter {
			includeGroup "maven.modrinth"
		}
	}

	exclusiveContent {
		forRepository {
			maven {
				name = "GeckoLib"
				url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
			}
		}

		filter {
			includeGroupAndSubgroups "com.geckolib"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation "maven.modrinth:1eAoo2KR:${project.yacl_version}"
	implementation "maven.modrinth:WKwQAwke:${project.libjf_version}"
	implementation "maven.modrinth:TiF5QWZY:${project.respackopts_version}"
	implementation "com.geckolib:geckolib-fabric-26.2:${project.geckolib_version}"

	compileOnlyApi "maven.modrinth:YL57xq9U:${project.iris_version}"
	implementation "maven.modrinth:YL57xq9U:${project.iris_version}"

	implementation 'ar.com.hjg:pngj:2.1.0'
}

loom {
	runs {
		client {
			vmArg "-Xmx16G"
		}
		"server" {
			vmArg "-Xmx4G"
		}
	}
}

processResources {
	def version = project.version

	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name

	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add publishing repositories here if needed.
	}
}
